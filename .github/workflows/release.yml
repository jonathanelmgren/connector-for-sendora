name: Release

# A tag such as v1.2.3 builds the plugin, checks the tag matches the version
# in the plugin's files, and attaches the zip to a GitHub release. Run by
# hand, it builds the zip and keeps it as an artifact only.
#
# Deploying to the wordpress.org plugin directory needs the repository
# variable WPORG_DEPLOY set to "true" and the secrets SVN_USERNAME and
# SVN_PASSWORD, which exist only once the plugin is approved. Without them
# the deploy job is skipped.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the release zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Composer dependencies
        run: npm run composer -- install --no-interaction --no-progress

      # On a tag, the build fails unless the tag is the plugin's version.
      - name: Build
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node bin/build.mjs "$RELEASE_TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: connector-for-sendora
          path: build/
          if-no-files-found: error

  github-release:
    name: Attach the zip to a GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: connector-for-sendora
          path: build/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/connector-for-sendora.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  wordpress-org:
    name: Deploy to the wordpress.org plugin directory
    if: github.ref_type == 'tag' && vars.WPORG_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: wordpress.org
    steps:
      # The deploy reads the directory's banners, icons and screenshots
      # from .wordpress-org/ in the checkout, when there is one.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: connector-for-sendora
          path: build/

      - name: Deploy
        # 10up/action-wordpress-plugin-deploy 2.3.0
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: connector-for-sendora
          BUILD_DIR: build/connector-for-sendora
